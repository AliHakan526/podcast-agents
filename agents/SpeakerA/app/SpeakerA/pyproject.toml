[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-speaker-a-agent"
version = "0.1.0"
description = "AgentCore A2A Agent using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[all] >= 0.3.0, < 0.4.0",
    "aws-opentelemetry-distro",
    "bedrock-agentcore[a2a] >= 1.9.1",
    "boto3 >= 1.35.0",
    "botocore[crt] >= 1.35.0",
    "strands-agents[a2a] >= 1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
